name: Build Android APK & AAB

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies & build web app
        run: |
          npm install
          npm run build
          npx cap sync android

      - name: Build Debug APK
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../Neama.apk

      - name: Upload APK Ready for Download
        uses: actions/upload-artifact@v4
        with:
          name: Neama-Android-APK
          path: Neama.apk

      - name: Publish Direct APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "تطبيق نِعمة للأندرويد (Neama APK v1.0)"
          body: "ملف تثبيت تطبيق نِعمة للأندرويد جاهز للتحميل المباشر (Neama.apk)"
          files: Neama.apk
          prerelease: false
